name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Kernel contract tests
        shell: pwsh
        run: tests/contracts.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: DPDFNet
          path: build/plugin/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path build/plugin/* -DestinationPath DPDFNet.zip
          gh release create $env:GITHUB_REF_NAME DPDFNet.zip --generate-notes
